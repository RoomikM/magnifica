<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ключі VAPID</title>
<style>body{font:16px/1.45 system-ui,sans-serif;max-width:640px;margin:24px auto;padding:0 16px}textarea{width:100%;box-sizing:border-box;font:13px monospace;padding:8px}button{font:inherit;padding:10px 16px;margin:6px 6px 14px 0}b{display:block;margin-top:14px}</style></head>
<body>
<h1>Ключі VAPID</h1>
<p>Ключі створюються прямо у вашому браузері й нікуди не надсилаються. <b style="display:inline">Приватний ключ нікому не показуйте і не надсилайте в чат.</b></p>
<button id="go">Створити ключі</button>
<b>Публічний ключ (його можна надіслати)</b>
<textarea id="pub" rows="3" readonly></textarea><button data-c="pub">Копіювати</button>
<b>Приватний ключ (лише в Cloudflare, секретно)</b>
<textarea id="prv" rows="2" readonly></textarea><button data-c="prv">Копіювати</button>
<script>
const b64u=b=>{let s='';new Uint8Array(b).forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const u8=s=>{const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
document.getElementById('go').onclick=async()=>{
 const k=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
 const j=await crypto.subtle.exportKey('jwk',k.privateKey);
 const raw=new Uint8Array(65);raw[0]=4;raw.set(u8(j.x),1);raw.set(u8(j.y),33);
 document.getElementById('pub').value=b64u(raw);document.getElementById('prv').value=j.d;
};
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const t=document.getElementById(b.dataset.c);t.select();navigator.clipboard&&navigator.clipboard.writeText(t.value)});
</script></body></html>
